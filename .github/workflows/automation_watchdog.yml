name: Praecursor Automation Watchdog

on:
  schedule:
    - cron: '45 21-23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check schedules without dispatching recovery runs
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: egx-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Recover Missing Scheduled Work
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW: ${{ inputs.dry_run }}
        run: python tools/automation_watchdog.py
