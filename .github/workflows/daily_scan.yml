name: Praecursor-EGX Autonomous Scanner

on:
  schedule:
    # Saturday–Wednesday at 18:30 UTC (20:30 Cairo winter / 21:30 summer).
    # Generates next-day target briefing before each trading day
    - cron: '30 18 * * 6,0,1,2,3'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force execution even on non-scan days'
        required: false
        type: boolean
        default: false
      dry_run_telegram:
        description: 'Skip sending Telegram notifications'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-egx-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-scanner:
    name: Scan & Deliver Next-Session Candidates
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gzip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch first (fast ~150MB instead of 2.5GB CUDA)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .

      - name: Install Playwright & Chromium
        run: |
          playwright install --with-deps chromium

      - name: Restore Database State
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p database
          mkdir -p data
          mkdir -p logs
          mkdir -p reports/archive

          # Try downloading latest dynamic snapshot from GitHub Release
          DOWNLOADED=false
          if gh release view db-latest >/dev/null 2>&1; then
            echo "Found existing 'db-latest' release. Downloading database snapshot..."
            if gh release download db-latest --pattern "praecursor.db.gz" --dir database --clobber; then
              echo "Decompressing downloaded snapshot..."
              gunzip -f database/praecursor.db.gz
              DOWNLOADED=true
            fi
          fi

          if [ "$DOWNLOADED" = "true" ]; then
            echo "Successfully restored database from 'db-latest' release."
          else
            echo "No prior release snapshot found. Database will initialize fresh from market sources."
          fi

          ls -lh database/

      - name: Execute Autonomous Daily Pipeline
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "src"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          if [ "${{ github.event.inputs.dry_run_telegram }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run-telegram"
          fi

          echo "Running command: python tools/run_autonomous_pipeline.py $FLAGS"
          if [ "${{ github.event.inputs.dry_run_telegram }}" != "true" ]; then
            test -n "$TELEGRAM_BOT_TOKEN" && test -n "$TELEGRAM_CHAT_ID" || { echo "Telegram Actions secrets are missing"; exit 1; }
          fi
          python tools/run_autonomous_pipeline.py $FLAGS

      - name: Persist Updated Database to GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "database/praecursor.db" ]; then
            echo "Compressing updated database..."
            python -c "import sqlite3; src=sqlite3.connect('database/praecursor.db'); dst=sqlite3.connect('database/backup.db'); src.backup(dst); dst.close(); src.close()"
            gzip -c database/backup.db > database/praecursor.db.gz
            echo "Compressed DB size: $(ls -lh database/praecursor.db.gz | awk '{print $5}')"

            echo "Uploading updated snapshot to GitHub Release 'db-latest'..."
            if gh release view db-latest >/dev/null 2>&1; then
              gh release upload db-latest database/praecursor.db.gz --clobber
            else
              gh release create db-latest database/praecursor.db.gz \
                --title "Praecursor Database Storage" \
                --notes "Automated persistent database snapshot for Praecursor-EGX autonomous scans" \
                --latest
            fi
            echo "Database successfully persisted to 'db-latest' release."
          fi

      - name: Upload Daily Reports & Telemetry Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-scan-reports-${{ github.run_id }}
          path: |
            reports/dashboard.html
            reports/opportunity_ranking.csv
            reports/charts/*.png
            data/scan_status.json
            logs/*.log
          retention-days: 30
