[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "praecursor"
version = "0.3.0"
description = "Praecursor-EGX Autonomous Trading Strategy scanner"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "tvdatafeed @ git+https://github.com/rongardF/tvdatafeed.git",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
]

[project.scripts]
praecursor-scan = "praecursor.cli.scanner:main"
praecursor-history = "praecursor.cli.history:main"
praecursor-sources = "praecursor.cli.sources:main"
praecursor-reports = "praecursor.cli.reports:main"
praecursor-backtest = "praecursor.cli.backtest:main"
praecursor-telegram = "praecursor.cli.telegram:main"
praecursor-dashboard = "praecursor.cli.dashboard:main"

[project.optional-dependencies]
dashboard = ["fastapi>=0.100", "uvicorn[standard]>=0.20"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
